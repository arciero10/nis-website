# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - app-nazionaleitalianasanitari-test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci

      - name: Build application
        run: |
          npm run build

      - name: Prepare standalone deploy package
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -a .next/standalone/. deploy/
          cp -a public deploy/public
          mkdir -p deploy/.next
          cp -a .next/BUILD_ID deploy/.next/BUILD_ID
          cp -a .next/static deploy/.next/static
          cp -a .next/server deploy/.next/server
          cp -a .next/routes-manifest.json deploy/.next/routes-manifest.json || true
          cp -a .next/prerender-manifest.json deploy/.next/prerender-manifest.json || true
          cp -a .next/build-manifest.json deploy/.next/build-manifest.json || true
          cp -a .next/app-build-manifest.json deploy/.next/app-build-manifest.json || true
          cp -a .next/server-reference-manifest.json deploy/.next/server-reference-manifest.json || true
          cp -a .next/required-server-files.json deploy/.next/required-server-files.json || true
          echo "DEPLOY ROOT"
          ls -la deploy
          echo "DEPLOY .NEXT"
          ls -la deploy/.next
          echo "DEPLOY .NEXT SERVER"
          ls -la deploy/.next/server
          test -f deploy/server.js
          test -f deploy/.next/BUILD_ID
          test -d deploy/.next/server
          test -d deploy/.next/static

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A022CC18217F4B58B37549D2F6A850A4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A71E84B543F0485487A56C9DDEE99B8E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DB36E3BECF224DA482EC3AB734C379D2 }}

      - name: Configure Azure startup command
        uses: azure/cli@v2
        with:
          inlineScript: |
            RESOURCE_GROUP=$(az webapp list --query "[?name=='app-nazionaleitalianasanitari-test'].resourceGroup | [0]" -o tsv)
            az webapp config set \
              --resource-group "$RESOURCE_GROUP" \
              --name "app-nazionaleitalianasanitari-test" \
              --startup-file "node server.js"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-nazionaleitalianasanitari-test'
          slot-name: 'Production'
          package: deploy

      - name: Restart Web App and verify Gala sponsors
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            resource_group="rg-panteleia-production"
            app_name="app-nazionaleitalianasanitari-test"
            public_origin="https://www.nazionaleitalianasanitari.com"

            az webapp restart \
              --resource-group "$resource_group" \
              --name "$app_name"

            for attempt in $(seq 1 30); do
              state=$(az webapp show \
                --resource-group "$resource_group" \
                --name "$app_name" \
                --query state \
                --output tsv)

              if [ "$state" = "Running" ]; then
                break
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "::error::La Web App non e tornata nello stato Running dopo il deploy."
                exit 1
              fi

              sleep 5
            done

            verify_page() {
              path="$1"
              expected="$2"
              url="${public_origin}${path}?deploy=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

              for attempt in $(seq 1 24); do
                html=$(curl \
                  --fail \
                  --silent \
                  --show-error \
                  --header "Cache-Control: no-cache" \
                  "$url" || true)

                if [[ "$html" == *"$expected"* ]]; then
                  return 0
                fi

                sleep 5
              done

              echo "::error::La pagina ${path} non contiene il markup sponsor atteso dopo il deploy."
              return 1
            }

            verify_page "/eventi" "Sponsor ufficiali NIS Gala 2026"
            verify_page "/" "PANTELEIA APS"

            for sponsor_asset in \
              "crai.png" \
              "servizi-cherubini.png" \
              "pic-event-solution.png" \
              "another-studio.png" \
              "gruppo-galli.png" \
              "Italian-Pathology-Genomics.png" \
              "limori.png" \
              "moretti.png" \
              "sakura.png"; do
              curl \
                --fail \
                --silent \
                --show-error \
                --output /dev/null \
                "${public_origin}/images/gala-2026/sponsor/${sponsor_asset}?deploy=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            done
